name: OutreachIOS
options:
  minimumXcodeGenVersion: 2.38.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: tech.taliferro.outreachios
    # Real device builds need a real team for the Associated Domains
    # capability (Universal Links) to actually provision - matches
    # taliferro-music-native's team.
    DEVELOPMENT_TEAM: "6377FLHLAG"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
packages:
  FirebaseiOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  TODDAuthKit:
    path: ../TODDAuthKit
  TODDEntitlementKit:
    path: ../TODDEntitlementKit
  TODDProfileKit:
    path: ../TODDProfileKit
  TODDAwardsKit:
    path: ../TODDAwardsKit
targets:
  OutreachIOS:
    type: application
    platform: iOS
    sources:
      - path: OutreachIOS
    settings:
      base:
        PRODUCT_NAME: OutreachIOS
        # App Store version (MARKETING_VERSION) and build number
        # (CURRENT_PROJECT_VERSION). Bump the build number for every upload
        # to App Store Connect - it must be higher than the last one.
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OUTREACH_API_BASE_URL: https://api.taliferro.tech/api
        # The "Outreach Subscription" monthly subscription in App Store
        # Connect (group OutreachSub).
        OUTREACH_APP_STORE_PRODUCT_ID: Outreach10001
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Outreach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS (exempt) - App Store Connect won't hold builds
        # for the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # Required for Face ID - without it iOS can refuse the biometric
        # check and the unlock screen never completes.
        NSFaceIDUsageDescription: Outreach uses Face ID to keep your email activity private when you open the app.
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # App Store validation rejects an iPad-capable build with no
        # orientations; iPad multitasking requires all four.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        OUTREACH_API_BASE_URL: $(OUTREACH_API_BASE_URL)
        OUTREACH_APP_STORE_PRODUCT_ID: $(OUTREACH_APP_STORE_PRODUCT_ID)
        # Native Google Sign-In's redirect callback scheme - the
        # REVERSED_CLIENT_ID from GoogleService-Info.plist, caught by
        # GoogleSignInHelper.handle(url) via .onOpenURL in
        # OutreachIOSApp.swift. Mirrors network-ios/pulse-ios.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.633736143723-71ka22hqlvpvmjrunbrk495g6g1vu636
    entitlements:
      path: OutreachIOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Push notifications (1.1). App Store / TestFlight exports switch
        # this to production automatically.
        aps-environment: development
        # Universal Links: see network-ios's project.yml for the full
        # explanation - same mechanism, this app's own domain.
        com.apple.developer.associated-domains:
          - applinks:outreach.taliferro.tech
    dependencies:
      - package: FirebaseiOS
        product: FirebaseAuth
      - package: FirebaseiOS
        product: FirebaseFirestore
      - package: TODDAuthKit
      - package: TODDEntitlementKit
      - package: TODDProfileKit
      - package: TODDAwardsKit
    scheme:
      testTargets: []
