name: OutreachIOS
options:
  minimumXcodeGenVersion: 2.38.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: tech.taliferro.outreachios
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
packages:
  FirebaseiOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  TODDAuthKit:
    path: ../TODDAuthKit
  TODDEntitlementKit:
    path: ../TODDEntitlementKit
targets:
  OutreachIOS:
    type: application
    platform: iOS
    sources:
      - path: OutreachIOS
    settings:
      base:
        PRODUCT_NAME: OutreachIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OUTREACH_API_BASE_URL: https://api.taliferro.tech/api
        # Set once Outreach's subscription product exists in App Store
        # Connect (see docs/app-store-exclusive-billing-plan.md) - empty is
        # expected until then; EntitlementService treats it as "not
        # configured yet".
        OUTREACH_APP_STORE_PRODUCT_ID: ""
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Outreach
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        OUTREACH_API_BASE_URL: $(OUTREACH_API_BASE_URL)
        OUTREACH_APP_STORE_PRODUCT_ID: $(OUTREACH_APP_STORE_PRODUCT_ID)
        # Native Google Sign-In's redirect callback scheme - the
        # REVERSED_CLIENT_ID from GoogleService-Info.plist, caught by
        # GoogleSignInHelper.handle(url) via .onOpenURL in
        # OutreachIOSApp.swift. Mirrors network-ios/pulse-ios.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.633736143723-71ka22hqlvpvmjrunbrk495g6g1vu636
    entitlements:
      path: OutreachIOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: FirebaseiOS
        product: FirebaseAuth
      - package: FirebaseiOS
        product: FirebaseFirestore
      - package: TODDAuthKit
      - package: TODDEntitlementKit
    scheme:
      testTargets: []
